<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pet Marketplace - PetCare Hub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/pet.css">
    <link rel="stylesheet" href="css/common.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-info">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="home.html">
            🐾 PetCare Hub
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul
                class="navbar-nav ms-auto align-items-center"
                id="mainNav">
            </ul>

        </div>

    </div>

</nav>


<section class="container mt-5">

    <h1 class="text-center fw-bold display-4">
        Find Your Perfect Pet
    </h1>


    <div class="row mt-4">

        <div class="col-md-8 d-flex flex-wrap gap-2">

            <button
                class="btn btn-primary btn-sm active"
                data-pet-filter="all">
                All
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="dog">
                Dogs
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="cat">
                Cats
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="bird">
                Birds
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="fish">
                Fish
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="rabbit">
                Rabbits
            </button>

            <button
                class="btn btn-primary btn-sm"
                data-pet-filter="others">
                Others
            </button>

        </div>


        <div class="col-md-4">

            <input
                type="text"
                id="petSearch"
                class="form-control"
                placeholder="Search Pet">

        </div>

    </div>

</section>


<section class="container mt-5">

    <div
        class="row g-4"
        id="petGrid">
    </div>


    <nav class="mt-5">

        <ul
            class="pagination justify-content-center"
            id="petPagination">
        </ul>

    </nav>

</section>


<footer class="bg-info text-center text-dark p-3 mt-5">

    © 2026 PetCare Hub. All Rights Reserved.

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/script.js"></script>

</body>

</html>
