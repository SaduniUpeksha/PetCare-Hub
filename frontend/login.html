<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - PetCare Hub</title>

<link rel="stylesheet"href="css/login.css">


</head>

<body>

<a class="logo">
    🐾 PetCare Hub
</a>


<div class="login-box">

    <h1>Login</h1>


    <form
        action="../backend/auth/login.php"
        method="POST">

        <label>
            Username :
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>


        <label>
            Password :
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <button type="submit">
            Login
        </button>

    </form>


    <p class="bottom-text">

        Don't have an account?

        <a href="register.html">
            Register Here
        </a>

    </p>

</div>


<script src="js/script.js"></script>

</body>

</html>
