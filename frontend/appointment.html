<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - PetCare Hub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet" href="css/common.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-info">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="home.html">
            🐾 PetCare Hub
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul
                class="navbar-nav ms-auto align-items-center"
                id="mainNav">
            </ul>

        </div>

    </div>

</nav>


<section class="appointment-section py-5">

    <div class="container">

        <div class="appointment-box">

            <h1 class="text-center mb-5">
                Book Appointment
            </h1>


            <form id="appointmentForm">


                <div class="mb-3">

                    <label class="form-label">
                        Your Pet
                    </label>

                    <select
                        id="petSelect"
                        name="pet_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Your Pet
                        </option>

                    </select>

                    <small class="text-muted">
                        You can add your pet from Dashboard → My Pets.
                    </small>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Doctor
                    </label>

                    <select
                        id="doctorSelect"
                        name="doctor_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Doctor
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Date & Time
                    </label>

                    <input
                        type="datetime-local"
                        name="appointment_date"
                        class="form-control"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Reason
                    </label>

                    <textarea
                        name="reason"
                        class="form-control"
                        rows="5"
                        placeholder="Enter reason for appointment">
                    </textarea>

                </div>


                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-lg btn-primary px-5 rounded-pill">

                        Submit

                    </button>

                </div>


            </form>

        </div>

    </div>

</section>


<footer class="bg-info text-center p-3">

    © 2026 PetCare Hub. All Rights Reserved.

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/script.js"></script>

</body>

</html>
