<!-- Appointment Form -->

<section class="appointment-section">

<div class="container">

<div class="appointment-box">

<h1 class="text-center mb-5">Book Appointment</h1>

<form>

<div class="mb-3">

<label class="form-label">Pet Name</label>

<input type="text" class="form-control" placeholder="Enter Pet Name">

</div>

<div class="mb-3">

<label class="form-label">Owner Name</label>

<input type="text" class="form-control" placeholder="Enter Owner Name">

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Doctor</label>

<select class="form-select">

<option>Select Doctor</option>

<option>Dr. Nimal Silva</option>

<option>Dr. Sanduni Perera</option>

<option>Dr. Tharindu Jay</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Date</label>

<input type="date" class="form-control">

</div>

</div>

<div class="mb-4">

<label class="form-label">Reason</label>

<textarea class="form-control" rows="5"></textarea>

</div>

<div class="text-center">

<button type="submit" class="btn btn-lg btn-primary px-5 rounded-pill">

Submit

</button>

</div>

</form>

</div>

</div>
